name: ci-build

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        run: |
          set +e
          timeout -s TERM 22m ./gradlew build --no-daemon > /tmp/b.log 2>&1
          rc=$?
          echo "===== FIRST ERRORS"
          grep -E "error:|symbol:|location:|does not exist|Execution failed|What went wrong" /tmp/b.log | head -40
          echo "===== SUMMARY"
          grep -E "^[0-9]+ errors|^BUILD|Could not resolve|Could not find" /tmp/b.log | head -20
          echo "gradle exit: $rc"
          ls -la build/libs || true
          exit $rc

      - name: Inspect tag appender API
        if: failure()
        continue-on-error: true
        run: |
          set +e
          for j in $(find ~/.gradle /home/runner/work -name '*.jar' 2>/dev/null | head -400); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/data/tags/TagAppender.class'; then
              echo "===== $j"
              javap -cp "$j" 'net.minecraft.data.tags.TagAppender' 2>&1 | head -25
              javap -cp "$j" 'net.minecraft.data.tags.BlockItemTagAppender' 2>&1 | head -25
              break
            fi
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jar
          path: build/libs/*.jar

      - name: Publish jar to artifact branch
        if: success()
        run: |
          mkdir -p /tmp/out
          cp build/libs/*.jar /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan claude-build-artifacts
          git rm -rf --cached . >/dev/null
          rm -rf src gradle .github build.gradle settings.gradle gradle.properties gradlew gradlew.bat README.md LICENSE .gitattributes .gitignore
          mkdir -p dist
          cp /tmp/out/*.jar dist/
          git add -f dist
          git commit -m "build output for $GITHUB_SHA"
          git push -f origin claude-build-artifacts
